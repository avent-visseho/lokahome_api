services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lokahome-api
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://lokahome:${DB_PASSWORD}@db:5432/lokahome
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_data:/app/static
      - app_logs:/app/logs
    networks:
      - lokahome-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: lokahome-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=lokahome
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=lokahome
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokahome -d lokahome"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lokahome-network

  redis:
    image: redis:7-alpine
    container_name: lokahome-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lokahome-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lokahome-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks worker --loglevel=info --concurrency=4
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://lokahome:${DB_PASSWORD}@db:5432/lokahome
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
    networks:
      - lokahome-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lokahome-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks beat --loglevel=info
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://lokahome:${DB_PASSWORD}@db:5432/lokahome
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lokahome-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  static_data:
  app_logs:

networks:
  lokahome-network:
    driver: bridge
